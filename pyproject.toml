[project]
name = "moground"
version = "0.1.0"
description = "Pilot: SAE-based interpretation and steering of modality preference in VLMs."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Luca Zhou" }]
dependencies = [
    "torch>=2.4",
    "torchvision",
    "transformers>=4.49",
    "accelerate>=0.34",
    "qwen-vl-utils>=0.0.8",
    "datasets>=2.20",
    "huggingface_hub>=0.24",
    "Pillow>=10.0",
    "einops>=0.8",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["ruff", "ipython", "jupyter"]
logging = ["wandb>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moground"]

[tool.ruff]
line-length = 100
target-version = "py310"
